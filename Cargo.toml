[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fast-aws-core = { path = "crates/core" }
fast-aws-ui = { path = "crates/ui" }
fast-aws-svc-ec2 = { path = "crates/svc-ec2" }

async-trait = "0.1"
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-runtime = "1.9"
aws-sdk-ec2 = "1.267"
aws-sdk-sts = "1.119"
aws-smithy-runtime-api = { version = "1.19", features = ["client"] }
aws-smithy-mocks = "0.3"
aws-smithy-types = "1.8"
aws-types = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
