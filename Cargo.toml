[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fast-aws-core = { path = "crates/core" }
fast-aws-ui = { path = "crates/ui" }
fast-aws-svc-ec2 = { path = "crates/svc-ec2" }
fast-aws-svc-cost = { path = "crates/svc-cost" }
fast-aws-svc-cloudwatch = { path = "crates/svc-cloudwatch" }
fast-aws-svc-ses = { path = "crates/svc-ses" }
fast-aws-svc-cognito = { path = "crates/svc-cognito" }
fast-aws-svc-events = { path = "crates/svc-events" }
fast-aws-svc-cloudfront = { path = "crates/svc-cloudfront" }
fast-aws-svc-secrets = { path = "crates/svc-secrets" }
fast-aws-svc-ssm = { path = "crates/svc-ssm" }
fast-aws-svc-rds = { path = "crates/svc-rds" }
fast-aws-svc-dynamodb = { path = "crates/svc-dynamodb" }
fast-aws-svc-apigw = { path = "crates/svc-apigw" }
fast-aws-svc-iam = { path = "crates/svc-iam" }
fast-aws-svc-logs = { path = "crates/svc-logs" }
fast-aws-svc-lambda = { path = "crates/svc-lambda" }
fast-aws-svc-s3 = { path = "crates/svc-s3" }

async-trait = "0.1"
aws-config = { version = "1.12", features = ["behavior-version-latest", "credentials-login"] }
aws-runtime = "1.9"
aws-sdk-costexplorer = "1.133"
aws-sdk-cloudwatch = "1.134"
aws-sdk-sesv2 = "1.140"
aws-sdk-cognitoidentity = "1.116"
aws-sdk-cognitoidentityprovider = "1.139"
aws-sdk-eventbridge = "1.122"
aws-sdk-scheduler = "1.114"
aws-sdk-cloudfront = "1.135"
aws-sdk-secretsmanager = "1.120"
aws-sdk-ssm = "1.128"
aws-sdk-rds = "1.154"
aws-sdk-dynamodb = "1.130"
aws-sdk-apigateway = "1.120"
aws-sdk-apigatewayv2 = "1.118"
aws-sdk-iam = "1.128"
aws-sdk-cloudwatchlogs = "1.156"
aws-sdk-lambda = "1.150"
aws-sdk-s3 = "1.152"
aws-sdk-ec2 = "1.267"
aws-sdk-sts = "1.119"
aws-smithy-runtime-api = { version = "1.19", features = ["client"] }
aws-smithy-mocks = "0.3"
aws-smithy-types = "1.8"
aws-types = "1.3"
futures-util = "0.3"
insta = "1.49"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Measured on 8 cores, single runs (docs/plan/00-foundation.md, "Spike 8
# follow-up"): dropping dependency debug info and keeping it in separate files
# took incremental rebuilds from 3.3 s to 2.7 s and the dev binary from 386 to
# 132 MiB, while our own crates keep line numbers for backtraces.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Thin LTO, abort-on-panic and stripping: the release binary is 34 MiB instead
# of 102 MiB, and the cold build measured faster in a single run. A panic ends
# the app (the terminal is still restored: ratatui's panic hook runs before the
# abort). 256 codegen units were slower on every measure; see the same section.
[profile.release]
lto = "thin"
panic = "abort"
strip = true
